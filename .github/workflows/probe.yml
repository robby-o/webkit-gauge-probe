name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safari:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Identify
        run: |
          sw_vers
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" /Applications/Safari.app/Contents/Info.plist
          sysctl -n kern.hv_vmm_present machdep.cpu.brand_string
          system_profiler SPDisplaysDataType | head -20
      - name: Serve
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          sudo safaridriver --enable
          open -a Safari
          sleep 20
      - name: Safari as it stands
        run: python3 drive.py /usr/bin/safaridriver http://localhost:8000/probe.html as-it-stands | tee as-it-stands.json
        continue-on-error: true
      - name: Safari with the setting in every domain
        run: |
          defaults write com.apple.WebKit.GPU WebKitAllowWebGPUOnVMs -bool YES
          defaults write com.apple.Safari WebKitAllowWebGPUOnVMs -bool YES
          defaults write -g WebKitAllowWebGPUOnVMs -bool YES
          killall Safari com.apple.WebKit.GPU 2>/dev/null || true
          python3 drive.py /usr/bin/safaridriver http://localhost:8000/probe.html with-setting | tee with-setting.json
        continue-on-error: true
      - uses: actions/upload-artifact@v5
        with:
          name: probe-${{ matrix.runner }}
          path: "*.json"
